name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secret key into build output
        env:
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp hemie-actor.js hemie-walk.png hemie-hello.png _site/
          sed -i "s|__CLAUDE_KEY__|${CLAUDE_KEY}|g" _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
